[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-crypto-5min"
version = "0.1.0"
description = "Research tooling for Polymarket Bitcoin 5-minute up/down markets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Polymarket-Crypto-5min contributors" }]
dependencies = [
  "numpy>=1.24,<2.2",
  "pandas>=2.0,<3",
  "python-dateutil>=2.8,<3",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
live = ["websockets>=12.0"]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["polymarket_crypto_5min*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_ignores = true
