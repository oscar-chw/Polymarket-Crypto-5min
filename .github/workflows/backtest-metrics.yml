name: backtest-metrics

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKTEST_START_DATE: "2026-07-01T00:00:00Z"
      BACKTEST_INITIAL_CAPITAL: "1000"
      BACKTEST_STAKE: "10"
      BACKTEST_MAX_MARKETS: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run unit tests
        run: python -m pytest -q
      - name: Download bounded recent closed Bitcoin 5-minute sample
        run: |
          set -euxo pipefail
          python scripts/download_history.py \
            --start-date-min "$BACKTEST_START_DATE" \
            --skip-clob-history \
            --skip-trades \
            --skip-binance \
            --log-level INFO
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          from polymarket_crypto_5min.downloader import download_btc_klines_for_markets, download_polymarket_price_history

          max_markets = int(os.environ.get("BACKTEST_MAX_MARKETS", "300"))
          markets_path = Path("data/raw/btc_5m_markets.csv")
          markets = pd.read_csv(markets_path).sort_values("start_ts").tail(max_markets).reset_index(drop=True)
          markets.to_csv(markets_path, index=False)
          print(f"Using {len(markets)} markets from {markets.start_iso.min()} to {markets.end_iso.max()}")
          download_polymarket_price_history(markets, out_path="data/raw/btc_5m_up_price_history.csv", sleep_s=0.02)
          download_btc_klines_for_markets(markets, out_path="data/raw/btc_usdt_1m.csv")
          PY
      - name: Run backtest and metrics
        run: |
          set -euxo pipefail
          python scripts/backtest_thresholds.py \
            --initial-capital "$BACKTEST_INITIAL_CAPITAL" \
            --stake "$BACKTEST_STAKE" \
            --min-trades 3
          echo "---- default metrics ----"
          cat data/processed/default_strategy_metrics.csv || true
          echo "---- default summary ----"
          cat data/processed/default_strategy_summary.csv || true
          echo "---- threshold top rows ----"
          python - <<'PY'
          import pandas as pd
          p='data/processed/threshold_report.csv'
          try:
              df=pd.read_csv(p)
              print(df.head(20).to_string(index=False))
          except Exception as exc:
              print(f'could not print threshold report: {exc}')
          PY
      - name: Upload backtest outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-outputs
          path: |
            data/raw/*.csv
            data/processed/*.csv
          if-no-files-found: ignore
