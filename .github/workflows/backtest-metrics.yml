name: backtest-metrics

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKTEST_START_DATE: "2026-07-01T00:00:00Z"
      BACKTEST_INITIAL_CAPITAL: "1000"
      BACKTEST_STAKE: "10"
      BACKTEST_MAX_MARKETS: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run unit tests
        run: python -m pytest -q
      - name: Download bounded recent closed Bitcoin 5-minute sample
        run: |
          set -euxo pipefail
          python scripts/download_history.py \
            --start-date-min "$BACKTEST_START_DATE" \
            --skip-clob-history \
            --skip-trades \
            --skip-binance \
            --log-level INFO
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          from polymarket_crypto_5min.clients import BinanceClient
          from polymarket_crypto_5min.downloader import download_btc_klines_for_markets, download_data_api_trades

          max_markets = int(os.environ.get("BACKTEST_MAX_MARKETS", "100"))
          markets_path = Path("data/raw/btc_5m_markets.csv")
          markets = pd.read_csv(markets_path).sort_values("start_ts").tail(max_markets).reset_index(drop=True)
          markets.to_csv(markets_path, index=False)
          print(f"Using {len(markets)} markets from {markets.start_iso.min()} to {markets.end_iso.max()}")

          trades = download_data_api_trades(markets, out_path="data/raw/btc_5m_data_api_trades.csv", batch_size=1, sleep_s=0.02)
          up_ids = set(markets["up_asset_id"].astype(str))
          records = []
          for _, trade in trades.iterrows():
              asset = str(trade.get("asset") or trade.get("asset_id") or trade.get("token_id") or trade.get("tokenId") or "")
              outcome = str(trade.get("outcome") or trade.get("outcomeName") or "").lower()
              if asset and asset not in up_ids and outcome not in {"up", "higher", "yes"}:
                  continue
              condition_id = trade.get("conditionId") or trade.get("condition_id") or trade.get("market") or trade.get("marketId")
              price = trade.get("price")
              timestamp = trade.get("timestamp") or trade.get("time") or trade.get("createdAt")
              if condition_id is None or price is None or timestamp is None:
                  continue
              ts = pd.to_datetime(timestamp, unit="s", utc=True, errors="coerce")
              if pd.isna(ts):
                  ts = pd.to_datetime(timestamp, utc=True, errors="coerce")
              if pd.isna(ts):
                  continue
              if not asset:
                  matched = markets.loc[markets["condition_id"].astype(str).eq(str(condition_id)), "up_asset_id"]
                  asset = str(matched.iloc[0]) if not matched.empty else ""
              records.append({"condition_id": condition_id, "market_id": None, "asset_id": asset, "asset_role": "up", "t": int(ts.timestamp()), "p": price, "ts": ts})
          prices = pd.DataFrame(records)
          if not prices.empty:
              prices["p"] = pd.to_numeric(prices["p"], errors="coerce")
              prices = prices.dropna(subset=["p"]).sort_values(["condition_id", "ts"])
          prices.to_csv("data/raw/btc_5m_up_price_history.csv", index=False)
          print(f"Built {len(prices)} UP-token trade-price points from public trade feed")
          btc_client = BinanceClient(base_url="https://api." + "binance.us")
          download_btc_klines_for_markets(markets, out_path="data/raw/btc_usdt_1m.csv", binance=btc_client)
          PY
      - name: Run backtest and metrics
        run: |
          set -euxo pipefail
          python scripts/backtest_thresholds.py \
            --initial-capital "$BACKTEST_INITIAL_CAPITAL" \
            --stake "$BACKTEST_STAKE" \
            --min-trades 3
          echo "---- default metrics ----"
          cat data/processed/default_strategy_metrics.csv || true
          echo "---- default summary ----"
          cat data/processed/default_strategy_summary.csv || true
          echo "---- threshold top rows ----"
          python - <<'PY'
          import pandas as pd
          p='data/processed/threshold_report.csv'
          try:
              df=pd.read_csv(p)
              print(df.head(20).to_string(index=False))
          except Exception as exc:
              print(f'could not print threshold report: {exc}')
          PY
      - name: Upload backtest outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-outputs
          path: |
            data/raw/*.csv
            data/processed/*.csv
          if-no-files-found: ignore
